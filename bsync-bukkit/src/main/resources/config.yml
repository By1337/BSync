# BSync Client
#
# Этот плагин подключает Bukkit-сервер к одному или нескольким BSync-серверам.
#
# Каждый BSync-сервер имеет:
#   - имя (например, bsync_server_id)
#   - группу (например, player_data)
#   - адрес и порт
#
# Другие плагины обращаются к данным через:
#
#   server://<server>/<channel>
#       конкретный BSync-сервер
#
#   group://<group>/<channel>
#       любой BSync-сервер указанной группы
#
# Например:
#
#   server://bauc/bv_eco
#
# означает:
#   BSync-сервер: bauc
#   канал:        bv_eco
#
# Канал является именем хранилища данных и используется
# BSync для создания соответствующей таблицы в БД.

id: client-1 # Имя клиента в логах.
workers: 1 # сколько бизнес потоков будет?
netty_threads: 1 # или "-Dbcsync.client.netty.threads=1" тогда здесь надо указать -1

# Данные для подключения к bsync серверам
servers:
  bsync_server_id: # id серера
    # Группа определяет пул BSync-серверов,
    # между которыми сервис может распределять нагрузку.
    group: player_data
    ip: localhost
    port: 8013
    private_key: 'PUT_HERE_PRIVATE_KEY' # приватный ключ из keys.yml